name: price-check
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: price-check
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fk.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          STATUS: "0"
          DROP_PCT: "2"
      - run: python vs.py
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          STATUS: "0"
          DROP_PCT: "2"
      - run: python amz.py
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          STATUS: "0"
          DROP_PCT: "2"
      - name: Save price history
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add fk.db
          git commit -m "update prices" || exit 0
          git pull --rebase
          git push
